<ng-container *ngIf="isLoginRoute; else dashboard">
  <router-outlet />
</ng-container>

<ng-template #dashboard>
  <!-- ══ TOP NAV ══ -->
  <nav class="top-nav">
    <button class="nav-menu-btn" (click)="toggleSidebar()" [title]="sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'">
      <svg *ngIf="sidebarOpen()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg *ngIf="!sidebarOpen()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Real Envision Logo in topbar -->
    <a class="nav-logo" href="#">
      <img src="assets/envision-logo-dark.png" alt="Envision" class="logo-img" width="100%" height="35px" />
    </a>

    <div class="nav-spacer"></div>

    <span class="nav-user-label" *ngIf="auth.user()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      {{ auth.user()!.displayName }}
    </span>

    <button class="nav-icon" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <button class="nav-icon" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
    </button>
    <div class="nav-avatar" [title]="auth.user()?.username || ''">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </nav>

    <div class="sidebar-overlay" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

        <button class="sb-item" [class.active]="activeMenu === 'WTGReceiving'" (click)="navigate('WTGReceiving')">
          <i class="pi pi-arrow-circle-down"></i>

  <i class="pi pi-database"></i>

      [class.active]="activeMenu === 'plant-allocation'"

      Plant-allocation
    </button>

        <button class="sb-item" (click)="toggleMastersMenu()">

          <span class="arrow" [class.rotate]="showMastersMenu">

        @if (showMastersMenu) {
          <div class="sb-submenu">
              <button class="sb-sub-item" [class.active]="activeMenu === 'components'"

              <button class="sb-sub-item" [class.active]="activeMenu === 'department'" 
                (click)="navigate('department')">Departments</button>
              <button class="sb-sub-item" [class.active]="activeMenu === 'clusters'"
                (click)="navigate('clusters')">Clusters</button>
              <button class="sb-sub-item" [class.active]="activeMenu === 'companyUsers'"
                  (click)="navigate('companyUsers')">Company Users</button>
              <button class="sb-sub-item" [class.active]="activeMenu === 'userGroups'" 
                (click)="navigate('userGroups')">User Groups</button>
              <button class="sb-sub-item" [class.active]="activeMenu === 'roles'"

            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <router-outlet />
    </main>
  </div>
</ng-template>

<!-- ══ LOGOUT CONFIRMATION DIALOG ══ -->
<div class="logout-overlay" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <div class="logout-dialog" (click)="$event.stopPropagation()">
    <div class="logout-dialog-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h3>Sign Out?</h3>
    <p>Are you sure you want to log out of ENVISION? Any unsaved changes will be lost.</p>
    <div class="logout-dialog-actions">
      <button class="btn-cancel" (click)="cancelLogout()">Cancel</button>
      <button class="btn-confirm-logout" (click)="doLogout()">Yes, Sign Out</button>
    </div>
  </div>
</div>
