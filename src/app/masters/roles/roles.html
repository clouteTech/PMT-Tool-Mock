<div class="card">
    <div class="card-header">
        <h2>Roles</h2>
    </div>
    <div class="custom-container">
        <p-table [value]="roleList" [rowHover]="true" [tableStyle]="{ 'min-width': 'max-content' }"
            [paginator]="true" [rows]="5" [first]="first" [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            (onPage)="pageChange($event)"
            [rowsPerPageOptions]="[10, 25, 50]">
            <ng-template #header>
                <tr>
                    <th>SL No</th>
                    <th>Role</th>
                    <th>Access</th>
                    <th>Resource</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-role let-i="rowIndex">
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ role.roleKey }}</td>
                    <td>{{ role.action }}</td>
                    <td>{{ role.resource }}</td>
                    <td>{{ role.description }}</td>
                    <td>
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
                        <button pButton pRipple text rounded severity="secondary" type="button" (click)="roleMenu($event, menu, role)">
                            <i pButtonIcon>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="text-gray-500">
                                    <rect width="24" height="24" fill="none" />
                                    <path fill="currentColor"
                                        d="M12 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m0 10a2 2 0 1 0 2 2a2 2 0 0 0-2-2m0-7a2 2 0 1 0 2 2a2 2 0 0 0-2-2" />
                                </svg>
                            </i>
                        </button>
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="100%" style="text-align: center; padding: 1rem 0;">No Records Found</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
